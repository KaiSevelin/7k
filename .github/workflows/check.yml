name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Lexes every example and every fenced 7k block in the specification, so a
      # decision cannot change without the spec and examples following.
      - run: npm run check
      # The checked-in schemas must be what the examples project to. `npm test` compares
      # them, and this proves the generator writes the same bytes rather than the test
      # merely agreeing with itself.
      - run: npm run project
      - run: git diff --exit-code -- examples/schema
